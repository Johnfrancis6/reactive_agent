[project]
name = "reactive_agent"
version =  "0.1.0"
description = "an react agent able to send email , make web search and mathematics computations"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipython>=9.16.1",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langsmith>=0.10.16",
    "load-dotenv>=0.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[tool.setuptools.packages.find]
include = ["app*"] 
